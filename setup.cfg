[metadata]
name = damuta
version = 1.1.0
author = Cait Harrigan
author_email = charrigan@cs.toronto.edu
description = Dirichlet allocation of mutations in cancer genomes
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/morrislab/damuta
project_urls = 
	Bug Tracker = https://github.com/morrislab/damuta/issues
classifiers = 
	Programming Language :: Python :: 3
	Development Status :: 1 - Planning
	License :: OSI Approved :: MIT License
	Operating System :: Unix

[options]
packages = find:
python_requires = >=3.12
install_requires =
    pymc>=6.4,<7
    pytensor
    numpy
    scipy
    pandas
    scikit-learn
    matplotlib
    seaborn
    wandb

[options.packages.find]
where = .

[options.extras_require]
jax =
    jax
dev =
    pytest
    pytest-cov
    sphinx>=1.4
    nbsphinx
    sphinx-gallery
    nbsphinx-link
    ipykernel
    sphinx-rtd-theme
